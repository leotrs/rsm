# Add this location inside the `server { listen 8888; ... }` block in
# /etc/nginx/sites-enabled/funnel.conf on syenite.
#
# No trailing slash on proxy_pass, so nginx forwards the full /r/<id> to the
# container and the app's /r/{raw} route matches directly, with nothing
# stripped and no root-path shim.

location /r/ {
    proxy_pass http://127.0.0.1:8700;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # A cold conversion fetches the e-print and runs pandoc, which can take
    # tens of seconds.
    proxy_read_timeout 120s;
}
