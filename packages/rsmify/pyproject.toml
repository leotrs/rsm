[project]
name = "rsmify"
version = "0.1.0"
description = "arXiv-to-RSM personal reader: fetch an arXiv paper, convert it via RSM, serve the HTML"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "rsm-lang",
]

[tool.uv.sources]
rsm-lang = { path = "../../", editable = true }

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rsmify*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the real arXiv over the network"]
# The network end-to-end test is opt-in: run it with `pytest -m network`.
addopts = "-m 'not network'"

[dependency-groups]
dev = [
    "pytest>=7.1.1",
]
