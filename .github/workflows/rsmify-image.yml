name: rsmify image

# Build the rsmify container image on main and push it to GHCR, so syenite can
# pull and restart (see packages/rsmify/deploy/). Path-filtered to the importer
# and grammar, so a docs-only commit does not rebuild the image.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/rsmify/**'
      - 'rsm/**'
      - 'tree-sitter-rsm/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/rsmify-image.yml'

concurrency:
  group: rsmify-image
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aris-pub/rsmify
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/rsmify/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
